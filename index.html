<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sell Analytics">
<title>Sell Analytics</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap">
<link rel="stylesheet" href="style.css?v=14">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="drawer" id="drawer">
    <div class="brand">Sell<br>Analytics</div>
    <nav id="nav"></nav>
    <div class="drawer-foot" id="navFoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="title-wrap"><h1 id="pageTitle">…</h1><span class="status" id="pageStatus"></span></div>
      <label class="month-pill" id="monthWrap"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><select id="monthSel" aria-label="Місяць"></select></label>
    </header>
    <div id="view" class="view"><div class="loading">Завантаження…</div></div>
  </main>
</div>
<button class="fab" id="fab" aria-label="Додати" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js?v=14"></script>
</body>
</html>
